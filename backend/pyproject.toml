[project]
name = "sam"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "python-dotenv>=1.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "mangum>=0.19.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.4",
    "pyjwt>=2.11.0",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.34.0",
]

# Local dev entrypoints (run from backend/): `uv run start`, `uv run seed`.
[project.scripts]
start = "src.main:serve"  # migrate + seed + uvicorn (reload) — local only
seed = "src.main:seed"    # (re)seed the local DB

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "pytest>=8.0.0",
    "ruff>=0.14.6",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

# Ruff - fast linter and formatter
[tool.ruff]
line-length = 170
target-version = "py313"
exclude = ["alembic", "scripts"]

lint.select = ["ANN", "ARG", "E", "F", "I", "ICN", "N", "RUF", "PT", "W", "UP"]
lint.ignore = ["ANN002", "ANN003", "E501", "E203"]
lint.exclude = [".venv", "__pycache__", ".git"]

# Import sorting
[tool.ruff.lint.isort]
known-first-party = ["src"]

# Code formatting
[tool.ruff.format]
