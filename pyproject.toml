[project]
name = "sam"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.31",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "mangum>=0.19.0",
    "pydantic>=2.12.4",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = ["pre-commit>=4.4.0", "ruff>=0.14.6"]
frontend = [
    "httpx>=0.28.1",
    "streamlit>=1.51.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

# Ruff - fast linter and formatter
[tool.ruff]
line-length = 170
target-version = "py313"

lint.select = ["ANN", "ARG", "E", "F", "I", "ICN", "N", "RUF", "PT", "W", "UP"]
lint.ignore = ["ANN002", "ANN003", "E501", "E203"]
lint.exclude = [".venv", "__pycache__", ".git"]

# Code formatting
[tool.ruff.format]
