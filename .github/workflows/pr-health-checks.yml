name: PR - Health Checks

on:
  push:
    branches: [main] # post-merge safety net (deploy.yml does not run tests)
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same branch/PR so only the latest commit is checked.
concurrency:
  group: pr-health-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.12"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Tests
        working-directory: backend
        run: uv run pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (next lint)
        working-directory: frontend
        run: npm run lint

      - name: Tests (vitest)
        working-directory: frontend
        run: npm test

      # `next build` runs the TypeScript type-checker and fails on any error,
      # so this is also the type-check gate. The static export prerenders pages
      # that import the API client, whose constructor throws if NEXT_PUBLIC_API_URL
      # is unset — so we pass a placeholder. It is inlined into this throwaway CI
      # artifact only; the real Amplify deploy build injects the real value.
      - name: Build (next build)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://ci.placeholder.invalid
        run: npm run build

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Type-check (tsc)
        working-directory: infra
        run: npx tsc --noEmit

      - name: CDK unit tests (jest)
        working-directory: infra
        run: npm test

      # No AWS credentials needed: there are no fromLookup() calls, and the
      # Amplify stack only warns (does not fail) when the githubToken context
      # is absent. This catches broken CDK stacks before they reach deploy.yml.
      - name: CDK synth
        working-directory: infra
        run: npx cdk synth --all --quiet
