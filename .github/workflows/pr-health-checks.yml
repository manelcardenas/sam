name: PR - Health Checks

on:
  push:
    branches: [main] # post-merge safety net (deploy.yml does not run tests)
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same branch/PR so only the latest commit is checked.
concurrency:
  group: pr-health-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.12"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Tests
        working-directory: backend
        run: uv run pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Scoped to the frontend workspace so this job doesn't install infra's
      # ~216 MB of aws-cdk. The root is included because it carries the `next`
      # pin that Amplify's platform detection reads.
      - name: Install dependencies
        run: npm ci -w frontend --include-workspace-root

      # `next` is declared in both package.json files on purpose; this fails
      # the build if they ever drift apart. See scripts/check-next-pin.mjs.
      - name: Check the next pin matches across manifests
        run: npm run check:next-pin

      - name: Lint (eslint)
        run: npm run lint -w frontend

      - name: Tests (vitest)
        run: npm test -w frontend

      # `next build` runs the TypeScript type-checker and fails on any error,
      # so this is also the type-check gate. The static export prerenders pages
      # that import the API client, whose constructor throws if NEXT_PUBLIC_API_URL
      # is unset — so we pass a placeholder. It is inlined into this throwaway CI
      # artifact only; the real Amplify deploy build injects the real value.
      - name: Build (next build)
        env:
          NEXT_PUBLIC_API_URL: https://ci.placeholder.invalid
        run: npm run build -w frontend

  # knip analyses the whole dependency graph, so unlike the frontend and infra
  # jobs it needs *every* workspace installed - a scoped install makes it
  # report the missing workspace's dependencies as unused. Hence its own job
  # with a plain `npm ci`.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install all workspaces
        run: npm ci

      - name: Dead code, exports and dependencies (knip)
        run: npm run knip

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci -w infra --include-workspace-root

      - name: Type-check (tsc)
        run: npm run type-check -w infra

      - name: CDK unit tests (jest)
        run: npm test -w infra

      # No AWS credentials needed: there are no fromLookup() calls, and the
      # Amplify stack only warns (does not fail) when the githubToken context
      # is absent. This catches broken CDK stacks before they reach deploy.yml.
      - name: CDK synth
        working-directory: infra
        run: npx cdk synth --all --quiet
