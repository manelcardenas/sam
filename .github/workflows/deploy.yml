name: Deploy Recipe Manager API

on:
  push:
    branches: [main] # Auto-deploy when PR merged to main
  workflow_dispatch: # Manual trigger button

permissions:
  id-token: write # ⚠️ Required for OIDC
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "infra/package-lock.json"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3
          role-session-name: GitHubActions-RecipeManager

      - name: Install CDK dependencies
        run: |
          cd infra
          npm ci

      - name: Deploy Lambda API Stack
        run: |
          cd infra
          npx cdk deploy RecipeManagerLambdaApiStack \
            --require-approval never \
            --outputs-file outputs.json

      - name: Deploy Amplify Frontend Stack
        run: |
          cd infra
          GITHUB_TOKEN=$(aws ssm get-parameter \
            --name /recipe-manager/github-token \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region eu-west-3)
          npx cdk deploy RecipeManagerAmplifyStack \
            --require-approval never \
            --context githubToken="$GITHUB_TOKEN" \
            --outputs-file outputs-amplify.json

      - name: Trigger Amplify build
        run: |
          APP_ID=$(jq -r '.RecipeManagerAmplifyStack.AmplifyAppId' infra/outputs-amplify.json)
          JOB_ID=$(aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name main \
            --job-type RELEASE \
            --query jobSummary.jobId \
            --output text \
            --region eu-west-3)
          echo "Amplify build started: job $JOB_ID"
          echo "AMPLIFY_JOB_ID=$JOB_ID" >> $GITHUB_ENV
          echo "AMPLIFY_APP_ID=$APP_ID" >> $GITHUB_ENV

      - name: Display deployment info
        run: |
          cd infra
          echo "✅ Deployment complete!"
          echo ""
          echo "📡 API Endpoint: $(jq -r '.RecipeManagerLambdaApiStack.ApiEndpoint' outputs.json)"
          echo "🌐 Frontend URL: $(jq -r '.RecipeManagerAmplifyStack.AmplifyAppUrl' outputs-amplify.json)"
          echo "🆔 Amplify App ID: $(jq -r '.RecipeManagerAmplifyStack.AmplifyAppId' outputs-amplify.json)"
