name: Deploy Frontend (Amplify)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/lib/application/amplify-stack.ts"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: # manual trigger

permissions:
  id-token: write # OIDC
  contents: read

# One frontend deploy at a time.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Amplify + trigger build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3
          role-session-name: GitHubActions-DeployFrontend

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      # The GitHub PAT is a SecureString in SSM; CloudFormation can't reference
      # it in AWS::Amplify::App, so we fetch it and pass it via --context.
      - name: Deploy Amplify Frontend Stack
        working-directory: infra
        run: |
          GITHUB_TOKEN=$(aws ssm get-parameter \
            --name /recipe-manager/github-token \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region eu-west-3)
          npx cdk deploy RecipeManagerAmplifyStack \
            --require-approval never \
            --context githubToken="$GITHUB_TOKEN" \
            --outputs-file outputs-amplify.json

      - name: Trigger Amplify build
        working-directory: infra
        run: |
          APP_ID=$(jq -r '.RecipeManagerAmplifyStack.AmplifyAppId' outputs-amplify.json)
          JOB_ID=$(aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name main \
            --job-type RELEASE \
            --query jobSummary.jobId \
            --output text \
            --region eu-west-3)
          echo "✅ Amplify build started: job $JOB_ID"
          echo "🌐 Frontend URL: $(jq -r '.RecipeManagerAmplifyStack.AmplifyAppUrl' outputs-amplify.json)"
