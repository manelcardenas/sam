name: Deploy Frontend (Amplify)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/lib/application/amplify-stack.ts"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: # manual trigger

permissions:
  id-token: write # OIDC
  contents: read

# One frontend deploy at a time.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Amplify + trigger build
    runs-on: ubuntu-latest
    # The CDK deploy plus waiting for Amplify's own build (a few minutes, more
    # when an earlier deploy's build is still running).
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3
          role-session-name: GitHubActions-DeployFrontend

      - name: Install CDK dependencies
        run: npm ci -w infra --include-workspace-root

      # The GitHub PAT is a SecureString in SSM; CloudFormation can't reference
      # it in AWS::Amplify::App, so we fetch it and pass it via --context.
      - name: Deploy Amplify Frontend Stack
        working-directory: infra
        run: |
          GITHUB_TOKEN=$(aws ssm get-parameter \
            --name /recipe-manager/github-token \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            --region eu-west-3)
          npx cdk deploy RecipeManagerAmplifyStack \
            --require-approval never \
            --context githubToken="$GITHUB_TOKEN" \
            --outputs-file outputs-amplify.json

      # `start-job` only queues the build. Two things go wrong if this step
      # stops there: merging two PRs in a row fails the second deploy, because
      # Amplify refuses a job while one is running (LimitExceededException),
      # and a build that fails *inside* Amplify still leaves this workflow
      # green. So: retry while Amplify is busy, then wait for the build and
      # fail if it does. StartJob and GetJob are all the CI role is granted —
      # no ListJobs needed.
      - name: Trigger Amplify build and wait for it
        working-directory: infra
        run: |
          APP_ID=$(jq -r '.RecipeManagerAmplifyStack.AmplifyAppId' outputs-amplify.json)

          JOB_ID=""
          for attempt in $(seq 1 30); do
            if JOB_ID=$(aws amplify start-job \
                --app-id "$APP_ID" \
                --branch-name main \
                --job-type RELEASE \
                --query jobSummary.jobId \
                --output text \
                --region eu-west-3 2> start-job.err); then
              break
            fi
            if grep -q LimitExceededException start-job.err; then
              echo "⏳ Another Amplify build is running — retrying in 30s ($attempt/30)"
              JOB_ID=""
              sleep 30
            else
              cat start-job.err
              exit 1
            fi
          done
          if [ -z "$JOB_ID" ]; then
            echo "❌ Amplify stayed busy for 15 minutes"
            exit 1
          fi
          echo "✅ Amplify build started: job $JOB_ID"

          while true; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" \
              --branch-name main \
              --job-id "$JOB_ID" \
              --query job.summary.status \
              --output text \
              --region eu-west-3)
            case "$STATUS" in
              SUCCEED) echo "✅ Amplify build $JOB_ID succeeded"; break ;;
              FAILED|CANCELLED) echo "❌ Amplify build $JOB_ID $STATUS"; exit 1 ;;
              *) echo "… build $JOB_ID: $STATUS"; sleep 20 ;;
            esac
          done
          echo "🌐 Frontend URL: $(jq -r '.RecipeManagerAmplifyStack.AmplifyAppUrl' outputs-amplify.json)"
