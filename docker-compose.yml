services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${PORT:-9000}:${PORT:-9000}"
    environment:
      - PORT=${PORT:-9000}
      - HOST=0.0.0.0
      - USE_DYNAMODB=true
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - TABLE_NAME=${TABLE_NAME:-recipes}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - AWS_REGION=${AWS_REGION:-eu-west-3}
    depends_on:
      dynamodb-local:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:9000/health")''',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  # Create DynamoDB table on startup
  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - AWS_REGION=${AWS_REGION:-eu-west-3}
    entrypoint:
      - sh
      - -c
      - |
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name recipes \
          --attribute-definitions AttributeName=id,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          2>&1 || true
    restart: "no"
